name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: version to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Release check
        # The version goes through env, never into the script text, so a crafted tag or input
        # cannot inject shell.
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: go run ./internal/ci release-check "$VERSION"
      - name: Data status
        # A release is blocked when holiday data has fewer than 183 days left.
        run: go run ./tools/data-status

  ci:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
        goarch: [""]
        include:
          # int is 32 bits on 386, which is where the overflow guards in AddDays and AddMonths matter.
          - os: ubuntu-latest
            go: "1.27"
            goarch: "386"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go run ./internal/ci

  consumer:
    # The same outside-the-module check as ci.yml, so a release cannot ship a module that does not
    # import from outside the checkout.
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Consumer module outside the repository
        run: go run ./tools/consumer-check
      - name: Broken import fails
        run: go run ./tools/consumer-check -negative

  mutation:
    # The same mutation gate as ci.yml, so a tag cannot release a commit whose survivor baselines
    # do not hold. Go is pinned to the version the baselines were measured with.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Core mutation gate
        run: go run ./tools/mutation-check -package=core -workers=4
      - name: Patro mutation gate
        run: go run ./tools/mutation-check -package=patro -workers=4

  api:
    # The same API gate as ci.yml, so a tag cannot remove or change an exported identifier.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: API compatibility
        run: go run ./tools/api-check

  fuzz:
    # The weekly fuzz budget, repeated before a release. A crasher stays in testdata/fuzz, so the
    # job fails until the input is a normal regression test and the fix is in.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Fuzz every target
        run: go run ./tools/fuzz-check -time=3m -parallel=4
      - name: Keep the crasher
        # A crasher written on the runner is otherwise lost with the workspace.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  lint:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    # The golang/govulncheck-action installs @latest, so the scanner is pinned here instead.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release:
    # A dispatched run stops at preflight and CI; the release and proxy jobs only run for a tag.
    # A dispatch started from a tag ref is still a dry run; only a tag push releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ci, lint, govulncheck, consumer, mutation, fuzz, api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "] -") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

  proxy:
    # A dispatch started from a tag ref is still a dry run; only a tag push releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Ask the proxy to index the version
        run: GOPROXY=proxy.golang.org go list -m "github.com/sanamhub/nepdate-go@$GITHUB_REF_NAME"

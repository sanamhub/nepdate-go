name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: version to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Release readiness
        # The version goes through env, never into the script text, so a crafted tag or input
        # cannot inject shell. The command checks CHANGELOG, README, ADR-0008, shared/VERSION,
        # NOTICE and that go list -m all names only this module.
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: go run ./internal/ci release-check "$VERSION"
      - name: Data status
        # A release is blocked when holiday data has fewer than 183 days left.
        run: go run ./tools/data-status

  ci:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.26", "1.27"]
        goarch: [""]
        include:
          # int is 32 bits on 386, which is where the overflow guards in AddDays and AddMonths matter.
          - os: ubuntu-latest
            go: "1.27"
            goarch: "386"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go run ./internal/ci

  consumer:
    # The same outside-the-module check as ci.yml, so a release cannot ship a module that does not
    # import from outside the checkout.
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Consumer module outside the repository
        run: go run ./tools/consumer-check
      - name: Broken import fails
        run: go run ./tools/consumer-check -negative

  mutation:
    # The same mutation gate as ci.yml, so a tag cannot release a commit whose survivor baselines
    # do not hold. Go is pinned to the version the baselines were measured with.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Core mutation gate
        run: go run ./tools/mutation-check -package=core -workers=4
      - name: Patro mutation gate
        run: go run ./tools/mutation-check -package=patro -workers=4

  api:
    # The same API gate as ci.yml, so a tag cannot remove or change an exported identifier.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: API compatibility
        run: go run ./tools/api-check
      - name: pkg.go.dev preview
        # The quality gates skip this test on any Go but 1.27.1, and setup-go "1.27" may resolve to a
        # later patch, so this job is where docs/godoc is enforced. The variable turns the skip into
        # a failure if the pin ever drifts from the generator.
        env:
          NEPDATE_GODOC_REQUIRED: "1"
        run: go test -count=1 -run '^TestGoDocPreview$' .

  fuzz:
    # The weekly fuzz budget, repeated before a release. A crasher stays in testdata/fuzz, so the
    # job fails until the input is a normal regression test and the fix is in.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Fuzz every target
        run: go run ./tools/fuzz-check -time=3m -parallel=4
      - name: Keep the crasher
        # A crasher written on the runner is otherwise lost with the workspace.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30

  lint:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    # The golang/govulncheck-action installs @latest, so the scanner is pinned here instead.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  release:
    # A dispatched run stops at preflight and CI; the release and verify jobs only run for a tag.
    # A dispatch started from a tag ref is still a dry run; only a tag push releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [ci, lint, govulncheck, consumer, mutation, fuzz, api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub Release
        # Notes come from the CHANGELOG section, not the commit log. A tag with a pre-release part,
        # such as v0.1.0-beta.1, becomes a GitHub pre-release, so it is never shown as the latest.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "] -") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo '```'
            echo "go get github.com/sanamhub/nepdate-go@$GITHUB_REF_NAME"
            echo '```'
            echo
            echo "### Verification"
            echo
            echo "- The module is served by proxy.golang.org and its hash is recorded in sum.golang.org, so"
            echo "  \`go get\` checks it against the public checksum database."
            echo "- After this release, a consumer module fetched the version from the proxy and converted"
            echo "  a date and read a patro event on Linux, macOS and Windows (verify-published)."
          } >> notes.md
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            --verify-tag "${prerelease[@]}"

  verify-published:
    # Called, not triggered: a release created with GITHUB_TOKEN fires no release event. It fetches
    # the tag through proxy.golang.org, which also makes the proxy index it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: release
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ github.ref_name }}

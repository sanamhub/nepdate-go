name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 1.24 is the minimum in go.mod; it runs the tests only, on Linux, at the exact patch verified
        # locally (ADR-0008). The full gates need the Go 1.26 and 1.27 entries.
        go: ["1.24.13", "1.26", "1.27"]
        goarch: [""]
        exclude:
          - os: windows-latest
            go: "1.24.13"
          - os: macos-latest
            go: "1.24.13"
        include:
          # int is 32 bits on 386, which is where the overflow guards in AddDays and AddMonths matter.
          - os: ubuntu-latest
            go: "1.27"
            goarch: "386"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # golangci-lint and govulncheck run in their own jobs below; here the CI program skips them.
      - name: Tests on the minimum Go version
        if: matrix.go == '1.24.13'
        # local: fail rather than let a toolchain line switch to a newer Go.
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - name: Quality gates
        if: matrix.go != '1.24.13'
        run: go run ./internal/ci

  # Fails when shared/ differs from the hub at the commit in shared/VERSION (ADR-0001 §4).
  shared-check:
    permissions:
      contents: read
    uses: sanamhub/nepdate/.github/workflows/shared-check.yml@f94d67c0c85de7909cf54d7e4e96f226ca750129 # main 2026-10-31

  consumer:
    # A module outside the checkout imports both packages through a replace, as a user would.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Consumer module outside the repository
        run: go run ./tools/consumer-check
      - name: Broken import fails
        run: go run ./tools/consumer-check -negative

  mutation:
    # Gremlins on the hand-written files of both packages; at most 4 workers per run. Each gate
    # fails below 99.5 % efficacy or when a count in that package's baseline is higher, lower, new
    # or missing. Go is pinned to the version the baselines were measured with; a bump re-runs
    # -update.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Core mutation gate
        run: go run ./tools/mutation-check -package=core -workers=4
      - name: Patro mutation gate
        run: go run ./tools/mutation-check -package=patro -workers=4

  api:
    # Gate 9 in its own job, with the tool pin and snapshot compared at the module root.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: API compatibility
        run: go run ./tools/api-check
      - name: pkg.go.dev preview
        # The quality gates skip this test on any Go but 1.27.1, and setup-go "1.27" may resolve to a
        # later patch, so this job is where docs/godoc is enforced. The variable turns the skip into
        # a failure if the pin ever drifts from the generator.
        env:
          NEPDATE_GODOC_REQUIRED: "1"
        run: go test -count=1 -run '^TestGoDocPreview$' .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    # The golang/govulncheck-action installs @latest, so the scanner is pinned here instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
